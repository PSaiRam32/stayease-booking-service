server:
  port: 8085

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always


resilience4j:
  bulkhead:
    configs:
      default:
        max-concurrent-calls: 10
        max-wait-duration: 2s

    instances:
      payment-service:
        base-config: default
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 2s
        retry-exceptions:
          - feign.RetryableException
          - java.net.ConnectException
          - java.net.SocketTimeoutException
        ignore-exceptions:
          - java.lang.IllegalArgumentException
          - jakarta.validation.ValidationException

    instances:
      notification-service:
        base-config: default

      payment-service:
        base-config: default

      property-service:
        base-config: default

      user-service:
        base-config: default

  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        permitted-number-of-calls-in-half-open-state: 3
        wait-duration-in-open-state: 30s
        automatic-transition-from-open-to-half-open-enabled: true

        record-exceptions:
          - feign.FeignException
          - java.net.ConnectException
          - java.net.SocketTimeoutException

    instances:
      notification-service:
        base-config: default

      payment-service:
        base-config: default

      property-service:
        base-config: default

      user-service:
        base-config: default

spring:
  application:
    name: booking-service

  profiles:
    active: local

feign:
  client:
    config:
      default:
        logger-level: FULL

logging:
  level:
    root: INFO
    com.stayease.booking_service: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: INFO
    com.stayease.booking_service.config.PropertyClient: DEBUG
    com.stayease.booking_service.config.PaymentClient: DEBUG
    com.stayease.booking_service.config.NotificationClient: DEBUG
    com.stayease.booking_service.config.UserClient: DEBUG
    io.github.resilience4j.retry: DEBUG
    io.github.resilience4j.circuitbreaker: DEBUG
    io.github.resilience4j.bulkhead: DEBUG

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

---
spring:
  config:
    activate:
      on-profile: local

  datasource:
